# Placeholder replication credentials — replace before applying, and prefer
# sourcing this from a real secret manager (AWS Secrets Manager / GCP Secret
# Manager via External Secrets Operator) rather than a committed Secret, so
# the same value is available in both regions without a manual sync step.
# See infra/dr/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: greenpay-dr-secrets
  namespace: greenpay
type: Opaque
stringData:
  POSTGRES_REPLICATION_USER: "replicator"
  POSTGRES_REPLICATION_PASSWORD: "changeme"
  # Set after provisioning postgres-replication-svc's LoadBalancer in the
  # primary region (kubectl get svc postgres-replication-svc -o
  # jsonpath='{.status.loadBalancer.ingress[0].hostname}'). Consumed by the
  # secondary overlay's standby bootstrap.
  PRIMARY_POSTGRES_HOST: "postgres-replication-svc.primary-region.example.internal"
