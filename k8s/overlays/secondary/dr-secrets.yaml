# Must match ../primary/dr-secrets.yaml exactly (same replication
# credentials, and PRIMARY_POSTGRES_HOST pointing at the primary region's
# postgres-replication-svc LoadBalancer hostname). Keeping two copies of a
# committed placeholder Secret in sync by hand is exactly the kind of thing
# that causes a DR plan to silently rot — see docs/disaster-recovery.md's
# "Secrets and config replication" section for why the real deployment
# should source both from one External Secrets Operator-backed store
# instead of two independent committed manifests like this one.
apiVersion: v1
kind: Secret
metadata:
  name: greenpay-dr-secrets
  namespace: greenpay
type: Opaque
stringData:
  POSTGRES_REPLICATION_USER: "replicator"
  POSTGRES_REPLICATION_PASSWORD: "changeme"
  PRIMARY_POSTGRES_HOST: "postgres-replication-svc.primary-region.example.internal"
  # Consumed by dr-controller.yaml. This MUST be the primary region's own
  # direct ingress endpoint (e.g. its regional load balancer hostname), NOT
  # the public GSLB/Route53-managed domain (greenpay.app). Once Route53
  # fails over, the public domain starts resolving to the secondary region
  # itself — a controller polling that name would see its own cluster's
  # health and never detect that the primary is actually down.
  PRIMARY_HEALTH_URL: "https://primary-region.internal-lb.greenpay.example.com/health/ready"
